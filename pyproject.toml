[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "braincoder"
version = "0.7.0"
description = "Fit encoding models to fMRI data and invert them for Bayesian decoding"
authors = [
    {name = "Gilles de Hollander", email = "gilles.de.hollander@gmail.com"},
    {name = "Maike Renkert"},
    {name = "Christian C. Ruff"},
    {name = "Tomas H. Knapen"}
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "keras>=3.0",
    "matplotlib",
    "seaborn",
    "pandas",
    "pandas_flavor",
    "scipy",
    "scikit-learn",
    "tqdm",
    "patsy",
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["fMRI", "encoding models", "population receptive field", "pRF", "Bayesian decoding", "neuroimaging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.urls]
Documentation = "https://braincoder-devs.github.io/"
Source = "https://github.com/Gilles86/braincoder"
Changelog = "https://github.com/Gilles86/braincoder/blob/main/CHANGELOG.md"

[project.optional-dependencies]
tensorflow = ["tensorflow>=2.16"]
jax = ["jax"]
torch = ["torch"]
test = [
    "pytest",
]
docs = [
    "sphinx",
    "sphinx-gallery",
    "sphinxcontrib-bibtex",
    "furo",
    "myst-parser",
    "ipython",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["braincoder*"]
exclude = ["notebooks*"]

[tool.setuptools.package-data]
# example data for braincoder.utils.data.load_szinte2024 (not a Python package)
braincoder = ["data/szinte2024/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]